# Languages offered on the website. The menu shows each language's own name (from the browser).
# `english` is what the translator is told; `rtl` marks right-to-left scripts.
# Add a language here and the next build translates everything into it.
source: en
languages:
  es: {english: "Spanish"}
  fr: {english: "French"}
  ar: {english: "Modern Standard Arabic", rtl: true}
